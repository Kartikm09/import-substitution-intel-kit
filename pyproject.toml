[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "import-substitution-intel-kit"
version = "0.1.0"
description = "Rank import-substitution and India manufacturing opportunities from public-safe product data."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kartik Mishra" }]
license = { text = "MIT" }
keywords = ["import-substitution", "india-manufacturing", "business-intelligence", "sourcing", "python"]

[project.scripts]
import-intel = "import_intel.cli:main"

